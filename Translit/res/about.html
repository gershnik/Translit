<html>
    <head>
        <meta charset="UTF-8">
        <meta name="color-scheme" content="light dark">
        <style>
            :root {
                --fg-secondary: #6e6e73;
                --accent: #3d74e6;
                --code-bg: #f2f2f4;
                --code-border: #e0e0e4;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --fg-secondary: #a1a1a6;
                    --accent: #7aa2f7;
                    --code-bg: #2a2a2e;
                    --code-border: #3a3a3f;
                }
            }

            html {
                overflow: hidden;
            }

            body {
                margin: 0px;
                font-family: -apple-system, 'Helvetica Neue', sans-serif;
                font-size: 13px;
                line-height: 1.35;
                -webkit-user-select: none;
                cursor: default;
            }

            #content {
                padding: 16px 20px;
            }

            #header {
                display: flex;
                align-items: center;
                gap: 18px;
            }

            #header img {
                flex: none;
                border-radius: 10%;
            }

            #name {
                font-size: 28px;
                font-weight: 600;
                line-height: 1.15;
            }

            #version, #copyright {
                margin-top: 2px;
                padding-left: 2px;
            }

            #copyright {
                font-size: 11px;
                color: var(--fg-secondary);
            }

            p {
                margin: 16px 0 0 0;
            }

            #uninstall p {
                margin-top: 10px;
            }

            #command {
                margin-top: 6px;
                padding: 6px 10px;
                border: 1px solid var(--code-border);
                border-radius: 6px;
                background-color: var(--code-bg);
                font-family: ui-monospace, 'SF Mono', Menlo, monospace;
                font-size: 11px;
                line-height: 1.5;
                white-space: nowrap;
                overflow-x: auto;
                -webkit-user-select: text;
                cursor: text;
            }

            a {
                color: var(--accent);
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div id="content">
            <div id="header">
                <img width="64" height="64" src="%ICONURL%" alt="">
                <div>
                    <div id="name">Translit</div>
                    <div id="version">Version %VERSION%</div>
                    <div id="copyright">%COPYRIGHT%</div>
                </div>
            </div>
            <p>
                More information and updates can be found at the <a href="https://github.com/gershnik/Translit">GitHub homepage</a>.
            </p>
            <div id="uninstall" style="visibility:%COMMAND_VISIBILITY%">
                <p>
                    To uninstall this application, run the following commands in Terminal:
                </p>
                <div id="command">%COMMAND%</div>
            </div>
        </div>
    </body>
</html>
